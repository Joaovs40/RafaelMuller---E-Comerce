<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1610"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d28a"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#a07830"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#c9a84c" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
    <line x1="0" y1="450" x2="400" y2="450"/>
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
  </g>

  <!-- Outer circle ornament -->
  <circle cx="200" cy="210" r="110" fill="none" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="200" cy="210" r="104" fill="none" stroke="url(#gold)" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- LD monogram text -->
  <text x="200" y="240" font-family="Georgia, serif" font-size="88" font-weight="400" fill="url(#gold)" text-anchor="middle" letter-spacing="-4" opacity="0.9">LD</text>

  <!-- Divider line -->
  <line x1="120" y1="295" x2="280" y2="295" stroke="url(#gold)" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Small diamond ornament -->
  <polygon points="200,287 204,291 200,295 196,291" fill="url(#gold)" opacity="0.6"/>

  <!-- Brand name -->
  <text x="200" y="325" font-family="Georgia, serif" font-size="13" fill="#c9a84c" text-anchor="middle" letter-spacing="5" opacity="0.85">LACES &amp; PERUCAS</text>

  <!-- Tagline -->
  <text x="200" y="348" font-family="Georgia, serif" font-size="9" fill="#a07830" text-anchor="middle" letter-spacing="3" opacity="0.7">BELEZA QUE REALÇA SUA ESSÊNCIA</text>

  <!-- Bottom image coming soon label -->
  <rect x="125" y="420" width="150" height="30" rx="15" fill="#c9a84c" fill-opacity="0.12" stroke="#c9a84c" stroke-opacity="0.3" stroke-width="0.8"/>
  <text x="200" y="439" font-family="Arial, sans-serif" font-size="9.5" fill="#c9a84c" text-anchor="middle" letter-spacing="2" opacity="0.8">FOTO EM BREVE</text>
</svg>
